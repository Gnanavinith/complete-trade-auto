services:
  - type: web
    name: complete-trade-auto-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r Server/requirements.txt
    startCommand: uvicorn Server.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DELTA_ENV
        value: production
      - key: LIVE_TRADING
        value: "true"
      - key: PAPER_MODE
        value: "false"
      - key: TRADING_SYMBOL
        value: BTCUSD
      - key: SIGNAL_TIMEFRAME
        value: 15m
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MONGODB_URI
        sync: false
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_RECIPIENT_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
