name: Keep Render Server Awake

on:
  schedule:
    # Runs every 5 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Status Endpoint
        run: |
          echo "Pinging Complete Trade Auto Render Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --max-time 60 "https://complete-trade-auto.onrender.com/status")
          echo "Render responded with HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Server is awake and healthy!"
          else
            echo "⚠️ Server responded with status $HTTP_STATUS (or is spinning up)."
          fi

      - name: Ping Backend Config Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 2 --max-time 30 "https://complete-trade-auto.onrender.com/config")
          echo "Config endpoint responded with: $HTTP_STATUS"
